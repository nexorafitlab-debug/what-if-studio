# Render a What If episode on GitHub Actions, sharded across parallel jobs.
#
# How it works:
#   1. setup job: turns the `chunks` input into a matrix list [0..N-1].
#   2. render job (one per chunk): checks out the repo, installs Node 20 +
#      Chrome + ffmpeg, renders ONLY its frame range with the Remotion CLI
#      (video-only: --muted, so no audio is baked into the chunks), and
#      uploads chunk-N.mp4 as an artifact.
#   3. stitch job: downloads all chunks, concats them, mixes the episode's
#      audio stems (public/<slug>/voice + music + sfx, already at their target
#      relative levels), loudnorms to -14 LUFS (same settings as master.py),
#      downscales to 1280x720, and uploads the final mp4.
#
# Why --muted chunks: the audio stems are mixed ONCE in the stitch job. If the
# chunks carried voice audio, the voice would be doubled.
#
# Trigger: Actions tab -> "Render episode" -> Run workflow. Inputs:
#   composition   Remotion composition id (default DeathCountV2)
#   slug          episode slug; audio stems live in public/<slug>/ (default death-count-v2)
#   total_frames  frames in the composition (default 976 = DeathCountV2, 32.6s @ 30fps)
#   chunks        parallel render jobs (default 4)
#
# The repo must be PUBLIC for unlimited free Actions minutes.
name: Render episode

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Remotion composition id'
        required: true
        default: 'DeathCountV2'
      slug:
        description: 'Episode slug (audio stems in public/<slug>/)'
        required: true
        default: 'death-count-v2'
      total_frames:
        description: 'Total frames in the composition'
        required: true
        default: '976'
      chunks:
        description: 'Number of parallel render chunks'
        required: true
        default: '4'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.set.outputs.chunks }}
    steps:
      - id: set
        run: |
          echo "chunks=$(python3 -c "import json; print(json.dumps(list(range(${{ inputs.chunks }}))))")" >> "$GITHUB_OUTPUT"

  render:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.setup.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Ensure ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Install dependencies
        run: npm ci

      - name: Render chunk ${{ matrix.chunk }}
        run: |
          TOTAL=${{ inputs.total_frames }}
          N=${{ inputs.chunks }}
          SIZE=$(( (TOTAL + N - 1) / N ))
          START=$(( ${{ matrix.chunk }} * SIZE ))
          END=$(( START + SIZE - 1 ))
          if [ "$END" -ge "$TOTAL" ]; then END=$(( TOTAL - 1 )); fi
          echo "chunk ${{ matrix.chunk }}: frames $START-$END of $TOTAL"
          REMOTION_BROWSER="${{ steps.chrome.outputs.chrome-path }}" \
            node node_modules/@remotion/cli/remotion-cli.js render src/index.ts \
            "${{ inputs.composition }}" "chunk-${{ matrix.chunk }}.mp4" \
            --frames="$START-$END" --muted --concurrency 2 --log=error
          echo "frames in chunk:"
          ffprobe -v error -show_entries stream=nb_frames -of csv=p=0 "chunk-${{ matrix.chunk }}.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: chunk-${{ matrix.chunk }}.mp4
          retention-days: 1

  stitch:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true

      - name: Ensure ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Stitch, mix, loudnorm, downscale
        run: |
          ls -la chunks/
          bash scripts/stitch.sh "${{ inputs.slug }}" "${{ inputs.total_frames }}" "${{ inputs.chunks }}" chunks "final-${{ inputs.composition }}-720p.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: final-${{ inputs.composition }}-720p
          path: final-${{ inputs.composition }}-720p.mp4
          retention-days: 7
